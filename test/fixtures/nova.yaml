apiVersion: agents.selamy.ai/v1alpha1
kind: EveAgentAppliance
metadata:
  name: nova
spec:
  entrypoint:
    capability: eve
    port: 3000
  capabilities:
    - name: eve
      version: 1
      mode: in_process
      protocol: eve.tool.v1
      lifecycleOwner: eve-process
      consequenceClass: C0
      approvalClass: internal-read-only
      permissions:
        network: []
        secrets: []
        rbac: []
      networkSurfaces: []
      resources:
        timeoutSeconds: 30
        memory: 256Mi
      health:
        kind: http-get
        requiredForReadiness: true
      telemetry:
        otel: active-span-only
        correlation:
          - eve.session.id
      io:
        inputSchemaRef: eve.tool.v1#request
        outputSchemaRef: eve.tool.v1#response
    - name: price-normalizer
      version: 1
      mode: exec
      protocol: selamy.exec.v1
      binary: price-normalizer
      lifecycleOwner: eve-process
      consequenceClass: C0
      approvalClass: internal-read-only
      permissions:
        network: []
        secrets: []
        rbac: []
      networkSurfaces: []
      resources:
        timeoutSeconds: 5
        memory: 32Mi
      health:
        kind: none
        requiredForReadiness: false
      telemetry:
        otel: active-span-only
        correlation:
          - eve.session.id
      io:
        inputSchemaRef: selamy.exec.v1#price-normalizer.request
        outputSchemaRef: selamy.exec.v1#price-normalizer.response
